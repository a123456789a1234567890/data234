<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WHO Dashboard FIXED</title>
<script src="https://d3js.org/d3.v7.min.js"></script>

<style>
body { font-family: Arial; background:#f4f4f4; }
.chart { display:inline-block; margin:20px; background:white; padding:10px; border-radius:8px; }

.tooltip {
    position:absolute;
    background:black;
    color:white;
    padding:6px;
    border-radius:5px;
    font-size:12px;
    pointer-events:none;
    opacity:0;
}
</style>
</head>

<body>

<h2>WHO Causes of Death Dashboard (FIXED VERSION)</h2>

<label>Year: <span id="yearLabel"></span></label>
<input type="range" id="yearSlider">

<div id="tooltip" class="tooltip"></div>

<div id="barChart" class="chart"></div>
<div id="bubbleChart" class="chart"></div>

<script>

// ================= LOAD CSV =================
d3.csv("GHE_FULL_DD.csv").then(raw => {

    console.log("RAW DATA SAMPLE:", raw[0]); // DEBUG

    // ================= SMART DATA CLEANING =================
    const data = raw.map(d => {

        return {
            cause: d["Cause"] || d["Cause of death"] || d["GHECAUSES"] || d["Dim1"],
            year: + (d["Year"] || d["YEAR"] || d["Time"]),
            deaths: + (d["Deaths"] || d["Numeric"] || d["Value"]),
            country: d["Country"] || d["SpatialDimValueCode"] || "Unknown"
        };

    }).filter(d =>
        d.cause &&
        !isNaN(d.year) &&
        !isNaN(d.deaths)
    );

    console.log("CLEAN DATA SAMPLE:", data.slice(0,5));

    const years = [...new Set(data.map(d => d.year))].sort((a,b)=>a-b);

    // ================= SLIDER =================
    const slider = d3.select("#yearSlider")
        .attr("min", d3.min(years))
        .attr("max", d3.max(years))
        .attr("value", years[0]);

    let currentYear = years[0];
    d3.select("#yearLabel").text(currentYear);

    slider.on("input", function(){
        currentYear = +this.value;
        d3.select("#yearLabel").text(currentYear);
        update();
    });

    // ================= SVG SETUP =================
    const width = 500, height = 300;

    const svgBar = d3.select("#barChart")
        .append("svg")
        .attr("width", width)
        .attr("height", height);

    const svgBubble = d3.select("#bubbleChart")
        .append("svg")
        .attr("width", width)
        .attr("height", height);

    const tooltip = d3.select("#tooltip");

    const x = d3.scaleBand().range([50, width-20]).padding(0.2);
    const y = d3.scaleLinear().range([height-40, 20]);

    svgBar.append("g").attr("class","x-axis")
        .attr("transform", `translate(0,${height-40})`);

    svgBar.append("g").attr("class","y-axis")
        .attr("transform", `translate(50,0)`);

    // ================= UPDATE FUNCTION =================
    function update(){

        const filtered = data.filter(d => +d.year === +currentYear);

        if(filtered.length === 0){
            console.log("No data for year:", currentYear);
            return;
        }

        // TOP 10 CAUSES
        const top = d3.rollups(
            filtered,
            v => d3.sum(v, d => d.deaths),
            d => d.cause
        )
        .sort((a,b)=>d3.descending(a[1], b[1]))
        .slice(0,10)
        .map(d => ({cause:d[0], deaths:d[1]}));

        // ================= BAR CHART =================
        x.domain(top.map(d => d.cause));
        y.domain([0, d3.max(top, d => d.deaths)]);

        svgBar.select(".x-axis")
            .transition().duration(600)
            .call(d3.axisBottom(x))
            .selectAll("text")
            .attr("transform","rotate(-40)")
            .style("text-anchor","end");

        svgBar.select(".y-axis")
            .transition().duration(600)
            .call(d3.axisLeft(y));

        const bars = svgBar.selectAll("rect")
            .data(top, d => d.cause);

        bars.enter()
            .append("rect")
            .merge(bars)
            .transition().duration(600)
            .attr("x", d => x(d.cause))
            .attr("y", d => y(d.deaths))
            .attr("width", x.bandwidth())
            .attr("height", d => height-40 - y(d.deaths))
            .attr("fill","steelblue");

        bars.exit().remove();

        // ================= BUBBLE CHART =================
        const root = d3.pack()
            .size([500,300])
            .padding(5)(
                d3.hierarchy({children: top})
                .sum(d => d.deaths)
            );

        const nodes = svgBubble.selectAll("circle")
            .data(root.leaves(), d => d.data.cause);

        nodes.enter()
            .append("circle")
            .merge(nodes)
            .transition().duration(600)
            .attr("cx", d => d.x)
            .attr("cy", d => d.y)
            .attr("r", d => d.r)
            .attr("fill","orange");

        nodes.exit().remove();
    }

    update();

});

</script>

</body>
</html>
