<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WHO Causes of Death Dashboard</title>
<script src="https://d3js.org/d3.v7.min.js"></script>

<style>
body { font-family: Arial; background:#f4f4f4; }
.chart { display:inline-block; margin:20px; background:white; padding:10px; border-radius:8px; }
.tooltip {
    position:absolute;
    background:black;
    color:white;
    padding:6px;
    border-radius:5px;
    font-size:12px;
    pointer-events:none;
    opacity:0;
}
</style>
</head>

<body>

<h2>WHO Top Causes of Death – Interactive Dashboard</h2>

<label>Year: <span id="yearLabel"></span></label>
<input type="range" id="yearSlider">

<div id="tooltip" class="tooltip"></div>

<div id="barChart" class="chart"></div>
<div id="bubbleChart" class="chart"></div>

<script>

// ================= LOAD LOCAL CSV =================
d3.csv("GHE_FULL_DD.csv").then(raw => {

    console.log("DATA LOADED", raw.slice(0,5));

    // CLEAN DATA
    const data = raw.map(d => ({
        cause: d.Cause,
        country: d.Country,
        year: +d.Year,
        sex: d.Sex,
        deaths: +d.Deaths
    })).filter(d => d.cause && d.year && d.deaths);

    const years = [...new Set(data.map(d => d.year))].sort();

    // ================= SLIDER =================
    const slider = d3.select("#yearSlider")
        .attr("min", d3.min(years))
        .attr("max", d3.max(years))
        .attr("value", years[0]);

    let currentYear = years[0];
    d3.select("#yearLabel").text(currentYear);

    slider.on("input", function(){
        currentYear = +this.value;
        d3.select("#yearLabel").text(currentYear);
        update();
    });

    // ================= BAR CHART =================
    const width = 500, height = 300;

    const svgBar = d3.select("#barChart")
        .append("svg")
        .attr("width", width)
        .attr("height", height);

    const x = d3.scaleBand().range([50, width-20]).padding(0.2);
    const y = d3.scaleLinear().range([height-40, 20]);

    svgBar.append("g").attr("class","x-axis")
        .attr("transform", `translate(0,${height-40})`);

    svgBar.append("g").attr("class","y-axis")
        .attr("transform", `translate(50,0)`);

    // ================= BUBBLE CHART =================
    const svgBubble = d3.select("#bubbleChart")
        .append("svg")
        .attr("width", width)
        .attr("height", height);

    const tooltip = d3.select("#tooltip");

    // ================= UPDATE FUNCTION =================
    function update(){

        const filtered = data.filter(d => d.year === currentYear);

        // TOP 10 CAUSES
        const top = d3.rollups(
            filtered,
            v => d3.sum(v, d => d.deaths),
            d => d.cause
        )
        .sort((a,b)=>d3.descending(a[1], b[1]))
        .slice(0,10)
        .map(d => ({cause:d[0], deaths:d[1]}));

        // ================= BAR =================
        x.domain(top.map(d => d.cause));
        y.domain([0, d3.max(top, d => d.deaths)]);

        svgBar.select(".x-axis")
            .transition().duration(700)
            .call(d3.axisBottom(x))
            .selectAll("text")
            .attr("transform","rotate(-40)")
            .style("text-anchor","end");

        svgBar.select(".y-axis")
            .transition().duration(700)
            .call(d3.axisLeft(y));

        const bars = svgBar.selectAll("rect")
            .data(top, d => d.cause);

        bars.enter()
            .append("rect")
            .merge(bars)
            .transition().duration(700)
            .attr("x", d => x(d.cause))
            .attr("y", d => y(d.deaths))
            .attr("width", x.bandwidth())
            .attr("height", d => height-40 - y(d.deaths))
            .attr("fill","steelblue");

        bars.exit().remove();

        // ================= BUBBLE PACK =================
        const root = d3.pack()
            .size([500,300])
            .padding(5)(
                d3.hierarchy({children: top})
                .sum(d => d.deaths)
            );

        const nodes = svgBubble.selectAll("circle")
            .data(root.leaves(), d => d.data.cause);

        nodes.enter()
            .append("circle")
            .merge(nodes)
            .transition().duration(700)
            .attr("cx", d => d.x)
            .attr("cy", d => d.y)
            .attr("r", d => d.r)
            .attr("fill","orange")
            .on("mouseover", (event,d)=>{
                tooltip.style("opacity",1)
                    .html(`<b>${d.data.cause}</b><br>Deaths: ${d.data.deaths}`)
                    .style("left",(event.pageX+10)+"px")
                    .style("top",(event.pageY-20)+"px");
            })
            .on("mouseout", ()=> tooltip.style("opacity",0));

        nodes.exit().remove();
    }

    update();

});

</script>

</body>
</html>
