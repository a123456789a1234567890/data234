<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>D3 FIXED DASHBOARD</title>
<script src="https://d3js.org/d3.v7.min.js"></script>

<style>
body { font-family: Arial; background:#f4f4f4; }
.chart { display:inline-block; margin:20px; background:white; padding:10px; border-radius:8px; }
</style>
</head>

<body>

<h2>D3 Dashboard (Debug Fixed Version)</h2>

<label>Year: <span id="yearLabel"></span></label>
<input type="range" id="yearSlider">

<div id="lineChart" class="chart"></div>
<div id="bubbleChart" class="chart"></div>

<script>

const url = "https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/data_gapminder.csv";

d3.csv(url).then(raw => {

    console.log("DATA LOADED:", raw.slice(0,5)); // DEBUG

    const data = raw.map(d => ({
        country: d.country,
        year: +d.year,
        lifeExp: +d.lifeExp,
        pop: +d.pop
    })).filter(d => d.country && d.year && d.lifeExp && d.pop);

    console.log("CLEAN DATA:", data.slice(0,5)); // DEBUG

    const years = [...new Set(data.map(d => d.year))].sort((a,b)=>a-b);

    // SLIDER
    const slider = d3.select("#yearSlider")
        .attr("min", d3.min(years))
        .attr("max", d3.max(years))
        .attr("value", years[0]);

    let year = years[0];
    d3.select("#yearLabel").text(year);

    slider.on("input", function(){
        year = +this.value;
        d3.select("#yearLabel").text(year);
        draw();
    });

    const width = 500, height = 300;

    const svgLine = d3.select("#lineChart")
        .append("svg")
        .attr("width", width)
        .attr("height", height);

    const svgBubble = d3.select("#bubbleChart")
        .append("svg")
        .attr("width", width)
        .attr("height", height);

    const x = d3.scaleLinear().range([50, width-20]);
    const y = d3.scaleLinear().range([height-40, 20]);

    svgLine.append("g").attr("class","x-axis")
        .attr("transform", `translate(0,${height-40})`);

    svgLine.append("g").attr("class","y-axis")
        .attr("transform", `translate(50,0)`);

    const line = d3.line()
        .x(d => x(d.year))
        .y(d => y(d.lifeExp));

    const path = svgLine.append("path")
        .attr("fill","none")
        .attr("stroke","blue")
        .attr("stroke-width",2);

    function draw(){

        const filtered = data.filter(d => d.year === year);

        console.log("FILTERED:", filtered.length); // DEBUG

        // LINE (global avg)
        const avg = d3.rollups(
            data,
            v => d3.mean(v, d => d.lifeExp),
            d => d.year
        ).map(d => ({year:d[0], lifeExp:d[1]}));

        x.domain(d3.extent(avg, d => d.year));
        y.domain([0, d3.max(avg, d => d.lifeExp)]);

        path.datum(avg)
            .attr("d", line);

        // BUBBLE FIXED
        const root = d3.pack()
            .size([500,300])
            .padding(5)(
                d3.hierarchy({children: filtered})
                .sum(d => d.pop)
            );

        const nodes = svgBubble.selectAll("circle")
            .data(root.leaves(), d => d.data.country);

        nodes.enter()
            .append("circle")
            .merge(nodes)
            .attr("cx", d => d.x)
            .attr("cy", d => d.y)
            .attr("r", d => d.r)
            .attr("fill","orange");

        nodes.exit().remove();
    }

    draw();

});

</script>

</body>
</html>
